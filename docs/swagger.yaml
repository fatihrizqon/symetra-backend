host: 127.0.0.1:3000
info:
  contact:
    email: fatihrizqon@gmail.com
    name: Fatih Rizqon
  description: This is an Official Documentation for Go REST API with Fiber Framework
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Go REST API with Fiber Framework
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return a JWT token in a cookie
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.AuthJSON'
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/response.JSON'
        "401":
          description: Authentication failed
          schema:
            $ref: '#/definitions/response.JSON'
      summary: User login
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Logout user, blacklist refresh token, clear cookie
      responses:
        "200":
          description: Successfully logged out
          schema:
            $ref: '#/definitions/response.JSON'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.JSON'
      summary: Logout user
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      description: Generate new access token and rotate refresh token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.AuthJSON'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.JSON'
      summary: Refresh access token
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            $ref: '#/definitions/response.JSON'
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/response.JSON'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.JSON'
      summary: User registration
      tags:
      - Auth
  /api/v1/bills:
    get:
      consumes:
      - application/json
      description: Retrieve all bill records with pagination
      parameters:
      - description: Search keyword
        in: query
        name: search
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      - description: Sort column
        in: query
        name: sort
        type: string
      - description: Sort direction (asc, desc)
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved all records.
          schema:
            $ref: '#/definitions/response.JSON'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.JSON'
      security:
      - BearerAuth: []
      summary: Get all bills
      tags:
      - Bills
    post:
      consumes:
      - application/json
      description: Store a new bill record
      parameters:
      - description: Bill Create Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.BillCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: A new record has been stored.
          schema:
            $ref: '#/definitions/response.JSON'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.JSON'
      security:
      - BearerAuth: []
      summary: Create bill
      tags:
      - Bills
  /api/v1/bills/{id}:
    delete:
      consumes:
      - application/json
      description: Remove a bill record by ID
      parameters:
      - description: Bill ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Selected record has been deleted.
          schema:
            $ref: '#/definitions/response.JSON'
        "404":
          description: Bill not found
          schema:
            $ref: '#/definitions/response.JSON'
      security:
      - BearerAuth: []
      summary: Delete bill
      tags:
      - Bills
    get:
      consumes:
      - application/json
      description: Retrieve a single bill by its ID
      parameters:
      - description: Bill ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved selected record.
          schema:
            $ref: '#/definitions/response.JSON'
        "404":
          description: Bill not found
          schema:
            $ref: '#/definitions/response.JSON'
      security:
      - BearerAuth: []
      summary: Get bill by ID
      tags:
      - Bills
    put:
      consumes:
      - application/json
      description: Update bill data by ID
      parameters:
      - description: Bill ID
        in: path
        name: id
        required: true
        type: string
      - description: Bill Update Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.BillUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Selected record has been updated.
          schema:
            $ref: '#/definitions/response.JSON'
        "404":
          description: Bill not found
          schema:
            $ref: '#/definitions/response.JSON'
      security:
      - BearerAuth: []
      summary: Update bill
      tags:
      - Bills
  /api/v1/bills/{id}/confirm:
    put:
      consumes:
      - application/json
      description: Mark a bill as confirmed and generate related journal entries
      parameters:
      - description: Bill ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Bill confirmed
          schema:
            $ref: '#/definitions/response.JSON'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.JSON'
      security:
      - BearerAuth: []
      summary: Confirm a bill
      tags:
      - Bills
  /api/v1/bills/{id}/pay:
    post:
      consumes:
      - application/json
      description: Record a payment against a confirmed bill
      parameters:
      - description: Bill ID
        in: path
        name: id
        required: true
        type: string
      - description: Bill Payment Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.BillPaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Bill payment recorded
          schema:
            $ref: '#/definitions/response.JSON'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.JSON'
      security:
      - BearerAuth: []
      summary: Record bill payment
      tags:
      - Bills
  /api/v1/bills/destroy:
    delete:
      consumes:
      - application/json
      description: Delete multiple bills by their IDs
      parameters:
      - description: Bulk Action Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.BulkActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Bills destroyed
          schema:
            $ref: '#/definitions/response.JSON'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.JSON'
      security:
      - BearerAuth: []
      summary: Bulk delete bills
      tags:
      - Bills
  /api/v1/coa:
    get:
