basePath: /
definitions:
  request.BillCreateRequest:
    properties:
      bill_date:
        type: string
      due_date:
        type: string
      items:
        items:
          $ref: '#/definitions/request.BillItemRequest'
        minItems: 1
        type: array
      notes:
        type: string
      purchase_order_id:
        type: string
      tax_rate:
        minimum: 0
        type: number
      vendor_id:
        type: string
    required:
    - bill_date
    - due_date
    - items
    - vendor_id
    type: object
  request.BillItemRequest:
    properties:
      account_id:
        type: string
      description:
        type: string
      discount:
        minimum: 0
        type: number
      price:
        minimum: 0
        type: number
      qty:
        minimum: 1
        type: number
      tax_applicable:
        type: boolean
    required:
    - description
    - price
    - qty
    type: object
  request.BillPaymentRequest:
    properties:
      amount:
        minimum: 0.01
        type: number
      notes:
        type: string
      payment_account_id:
        type: string
      payment_date:
        type: string
    required:
    - amount
    - payment_account_id
    - payment_date
    type: object
  request.BillUpdateRequest:
